<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-labelledby="title desc">
  <title id="title">What Ntasks does</title>
  <desc id="desc">One task list shared by you, Claude, Codex and any other AI agent, with the columns Ready, In progress and Done, and a lane for tasks waiting for you. Claude and Codex each take a ready task while "Choose sign-in" waits for your decision and "Build sign-in" is blocked on it. When you decide, "Build sign-in" moves to Ready and Claude takes it. A history line records each change and who made it.</desc>
  <defs>
    <!-- Claude's mark: the "Claude" icon from Simple Icons 16.36.0 (CC0-1.0), in its brand colour. -->
    <path id="claude" fill="#D97757" d="m4.7144 15.9555 4.7174-2.6471.079-.2307-.079-.1275h-.2307l-.7893-.0486-2.6956-.0729-2.3375-.0971-2.2646-.1214-.5707-.1215-.5343-.7042.0546-.3522.4797-.3218.686.0608 1.5179.1032 2.2767.1578 1.6514.0972 2.4468.255h.3886l.0546-.1579-.1336-.0971-.1032-.0972L6.973 9.8356l-2.55-1.6879-1.3356-.9714-.7225-.4918-.3643-.4614-.1578-1.0078.6557-.7225.8803.0607.2246.0607.8925.686 1.9064 1.4754 2.4893 1.8336.3643.3035.1457-.1032.0182-.0728-.164-.2733-1.3539-2.4467-1.445-2.4893-.6435-1.032-.17-.6194c-.0607-.255-.1032-.4674-.1032-.7285L6.287.1335 6.6997 0l.9957.1336.419.3642.6192 1.4147 1.0018 2.2282 1.5543 3.0296.4553.8985.2429.8318.091.255h.1579v-.1457l.1275-1.706.2368-2.0947.2307-2.6957.0789-.7589.3764-.9107.7468-.4918.5828.2793.4797.686-.0668.4433-.2853 1.8517-.5586 2.9021-.3643 1.9429h.2125l.2429-.2429.9835-1.3053 1.6514-2.0643.7286-.8196.85-.9046.5464-.4311h1.0321l.759 1.1293-.34 1.1657-1.0625 1.3478-.8804 1.1414-1.2628 1.7-.7893 1.36.0729.1093.1882-.0183 2.8535-.607 1.5421-.2794 1.8396-.3157.8318.3886.091.3946-.3278.8075-1.967.4857-2.3072.4614-3.4364.8136-.0425.0304.0486.0607 1.5482.1457.6618.0364h1.621l3.0175.2247.7892.522.4736.6376-.079.4857-1.2142.6193-1.6393-.3886-3.825-.9107-1.3113-.3279h-.1822v.1093l1.0929 1.0686 2.0035 1.8092 2.5075 2.3314.1275.5768-.3218.4554-.34-.0486-2.2039-1.6575-.85-.7468-1.9246-1.621h-.1275v.17l.4432.6496 2.3436 3.5214.1214 1.0807-.17.3521-.6071.2125-.6679-.1214-1.3721-1.9246L14.38 17.959l-1.1414-1.9428-.1397.079-.674 7.2552-.3156.3703-.7286.2793-.6071-.4614-.3218-.7468.3218-1.4753.3886-1.9246.3157-1.53.2853-1.9004.17-.6314-.0121-.0425-.1397.0182-1.4328 1.9672-2.1796 2.9446-1.7243 1.8456-.4128.164-.7164-.3704.0667-.6618.4008-.5889 2.386-3.0357 1.4389-1.882.929-1.0868-.0062-.1579h-.0546l-6.3385 4.1164-1.1293.1457-.4857-.4554.0608-.7467.2307-.2429 1.9064-1.3114Z"/>
    <!-- OpenAI's Blossom from OpenAI's logo pack (openai.com/brand), path unchanged; black in light, white in dark. -->
    <path id="openai-blossom" d="M508.749 317.399C516.777 287.314 508.991 253.884 485.389 230.282C461.788 206.681 428.36 198.895 398.273 206.923C376.231 184.928 343.39 174.956 311.148 183.596C278.906 192.234 255.45 217.292 247.36 247.361C217.291 255.451 192.233 278.91 183.595 311.149C174.957 343.391 184.927 376.232 206.924 398.274C198.896 428.359 206.683 461.789 230.284 485.391C253.885 508.992 287.313 516.779 317.401 508.75C339.442 530.745 372.286 540.717 404.525 532.079C436.767 523.441 460.223 498.384 468.313 468.315C498.383 460.224 523.44 436.766 532.078 404.526C540.716 372.285 530.747 339.443 508.749 317.402V317.399ZM470.899 244.776C486.892 260.77 493.488 282.601 490.687 303.412L415.577 260.046C412.411 258.218 408.509 258.218 405.345 260.046L317.401 310.82V277.526C317.401 275.191 318.652 273.005 320.676 271.837L387.644 233.174C414.178 218.353 448.346 222.223 470.901 244.776H470.899ZM357.837 311.144L398.275 334.491V381.185L357.837 404.532L317.398 381.185V334.491L357.837 311.144ZM264.776 269.693C265.207 239.305 285.644 211.649 316.453 203.393C338.3 197.54 360.505 202.744 377.127 215.573L302.014 258.937C298.848 260.764 296.898 264.144 296.898 267.798V369.346L268.065 352.699C266.043 351.531 264.776 349.353 264.776 347.017V269.691V269.693ZM203.391 316.454C209.244 294.608 224.854 277.978 244.276 269.999V356.73C244.276 360.384 246.226 363.763 249.392 365.591L337.337 416.365L308.503 433.013C306.481 434.181 303.961 434.188 301.939 433.02L234.971 394.357C208.868 378.789 195.138 347.261 203.391 316.454ZM244.775 470.9C228.781 454.906 222.186 433.075 224.986 412.264L300.096 455.63C303.263 457.457 307.164 457.457 310.328 455.63L398.273 404.856V438.149C398.273 440.485 397.022 442.671 394.997 443.839L328.029 482.502C301.495 497.322 267.327 493.452 244.772 470.9H244.775ZM450.897 445.982C450.466 476.371 430.029 504.027 399.22 512.283C377.373 518.136 355.168 512.932 338.547 500.102L413.659 456.738C416.826 454.911 418.775 451.532 418.775 447.877V346.329L447.609 362.977C449.631 364.145 450.897 366.323 450.897 368.659V445.985V445.982ZM512.282 399.221C506.429 421.068 490.819 437.697 471.397 445.676V358.946C471.397 355.292 469.448 351.912 466.281 350.085L378.336 299.311L407.17 282.663C409.192 281.495 411.712 281.487 413.734 282.655L480.702 321.318C506.805 336.887 520.536 368.415 512.282 399.221Z"/>
    <g id="person" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="0" cy="-4" r="3.6"/>
      <path d="M-6.5 7 A6.5 6.5 0 0 1 6.5 7"/>
    </g>
    <g id="robot" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <rect x="-7" y="-4" width="14" height="11" rx="3"/>
      <path d="M0 -4 V-8"/>
      <circle cx="0" cy="-9" r="1.2" fill="currentColor" stroke="none"/>
      <circle cx="-3" cy="1.5" r="1.3" fill="currentColor" stroke="none"/>
      <circle cx="3" cy="1.5" r="1.3" fill="currentColor" stroke="none"/>
    </g>
    <g id="lock" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <rect x="-6" y="-2" width="12" height="9" rx="2"/>
      <path d="M-3.5 -2 V-4.5 A3.5 3.5 0 0 1 3.5 -4.5 V-2"/>
    </g>
  </defs>
  <style>
    svg {
      --bg: #ffffff; --card: #f6f8fa; --line: #d0d7de; --edge: #818b98;
      --text: #1f2328; --muted: #59636e; --blue: #0969da;
      --amber: #9a6700; --amber-line: #bf8700; --amber-soft: #fff8c5;
      --red: #cf222e; --blossom: #000000;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117; --card: #161b22; --line: #3d444d; --edge: #768390;
        --text: #e6edf3; --muted: #9198a1; --blue: #4493f8;
        --amber: #d29922; --amber-line: #9e6a03; --amber-soft: #272115;
        --red: #f85149; --blossom: #ffffff;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: var(--text); }
    .panel { fill: var(--bg); stroke: var(--line); }
    .chip { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
    .blossom { fill: var(--blossom); }
    .chip-on { fill: none; stroke: var(--blue); stroke-width: 3; opacity: 0; }
    .you-on { fill: none; stroke: var(--amber-line); stroke-width: 3; opacity: 0; }
    .name { font-size: 19px; font-weight: 600; }
    .lead { font-size: 19px; fill: var(--muted); }
    .column { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .lane { fill: var(--amber-soft); stroke: var(--amber-line); stroke-width: 1.5; }
    .head { font-size: 22px; font-weight: 600; }
    .card { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
    .card-decision { fill: var(--bg); stroke: var(--amber-line); stroke-width: 2.5; }
    .card-blocked { fill: none; stroke: var(--red); stroke-width: 2.5; }
    .task { font-size: 22px; font-weight: 600; }
    .tag { font-size: 16px; font-weight: 600; }
    .amber { fill: var(--amber); color: var(--amber); }
    .red { fill: var(--red); }
    .red-line { fill: var(--red); stroke: var(--red); }
    .ink { color: var(--text); }
    .muted { fill: var(--muted); }
    .c { text-anchor: middle; }
    .timeline { stroke: var(--line); stroke-width: 2; }
    .dot-agent { fill: var(--blue); }
    .dot-you { fill: var(--amber-line); }
    .event { font-size: 16px; font-weight: 600; }
    .event-task { font-size: 15px; fill: var(--muted); }
    .quiet { font-size: 17px; fill: var(--muted); }

    /* Drawn as the list stands at the end. The animation starts each card
       where it began and moves it, one change at a time. */
    .run { animation-duration: 20s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .loop { animation-name: loop; animation-timing-function: linear; }
    #docs { animation-name: docs; }
    #search { animation-name: search; }
    #choose { animation-name: choose; }
    #build { animation-name: build; }
    #docs-agent { animation-name: docs-agent; }
    #search-agent { animation-name: search-agent; }
    #choose-needs { animation-name: choose-needs; opacity: 0; }
    #choose-decided { animation-name: choose-decided; }
    #build-blocked { animation-name: build-blocked; opacity: 0; }
    #build-agent { animation-name: build-agent; }
    #lane-arrow { animation-name: lane-arrow; opacity: 0; }
    #lane-empty { animation-name: lane-empty; }
    #claude-on { animation-name: claude-on; }
    #codex-on { animation-name: codex-on; }
    #you-on { animation-name: you-on; }
    #event-1 { animation-name: event-1; }
    #event-2 { animation-name: event-2; }
    #event-3 { animation-name: event-3; }
    #event-4 { animation-name: event-4; }
    #event-5 { animation-name: event-5; }

    @keyframes loop { 0% { opacity: 0; } 1.5%, 96% { opacity: 1; } 99.5%, 100% { opacity: 0; } }
    @keyframes docs { 0%, 12.5% { transform: translate(-520px, 0); } 15.5%, 37.5% { transform: translate(-260px, 0); } 40.5%, 100% { transform: translate(0, 0); } }
    @keyframes search { 0%, 22.5% { transform: translate(-260px, 0); } 25.5%, 100% { transform: translate(0, 0); } }
    @keyframes choose { 0%, 52% { transform: translate(0, 146px); } 55.5%, 100% { transform: translate(0, 0); } }
    @keyframes build { 0%, 58% { transform: translate(-260px, 228px); } 61.5%, 70% { transform: translate(-260px, 0); } 73%, 100% { transform: translate(0, 0); } }
    @keyframes docs-agent { 0%, 13% { opacity: 0; } 15%, 100% { opacity: 1; } }
    @keyframes search-agent { 0%, 23% { opacity: 0; } 25%, 100% { opacity: 1; } }
    @keyframes choose-needs { 0%, 49.5% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes choose-decided { 0%, 50% { opacity: 0; } 51.5%, 100% { opacity: 1; } }
    @keyframes build-blocked { 0%, 55.5% { opacity: 1; } 57.5%, 100% { opacity: 0; } }
    @keyframes build-agent { 0%, 71% { opacity: 0; } 73%, 100% { opacity: 1; } }
    @keyframes lane-arrow { 0%, 49.5% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes lane-empty { 0%, 60% { opacity: 0; } 62%, 100% { opacity: 1; } }
    @keyframes claude-on { 0%, 11% { opacity: 0; } 12.5%, 15.5% { opacity: 1; } 17%, 36% { opacity: 0; } 37.5%, 40.5% { opacity: 1; } 42%, 68.5% { opacity: 0; } 70%, 73% { opacity: 1; } 74.5%, 100% { opacity: 0; } }
    @keyframes codex-on { 0%, 21% { opacity: 0; } 22.5%, 25.5% { opacity: 1; } 27%, 100% { opacity: 0; } }
    @keyframes you-on { 0%, 48% { opacity: 0; } 49.5%, 55.5% { opacity: 1; } 57%, 100% { opacity: 0; } }
    @keyframes event-1 { 0%, 15% { opacity: 0; } 16.5%, 100% { opacity: 1; } }
    @keyframes event-2 { 0%, 25% { opacity: 0; } 26.5%, 100% { opacity: 1; } }
    @keyframes event-3 { 0%, 40% { opacity: 0; } 41.5%, 100% { opacity: 1; } }
    @keyframes event-4 { 0%, 53% { opacity: 0; } 54.5%, 100% { opacity: 1; } }
    @keyframes event-5 { 0%, 72.5% { opacity: 0; } 74%, 100% { opacity: 1; } }

    /* With reduced motion, every animation holds still at 8.5 s: agents at
       work while the decision and the task blocked on it wait. */
    @media (prefers-reduced-motion: reduce) {
      .run { animation-delay: -8.5s; animation-play-state: paused; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="799" height="559" rx="14"/>

  <!-- Who shares the list -->
  <rect class="chip" x="16" y="18" width="100" height="44" rx="22"/>
  <use href="#person" class="ink" transform="translate(40 41) scale(1.25)"/>
  <text class="name" x="58" y="47">You</text>
  <rect class="chip" x="126" y="18" width="128" height="44" rx="22"/>
  <use href="#claude" transform="translate(141 29) scale(0.9167)"/>
  <text class="name" x="171" y="47">Claude</text>
  <rect class="chip" x="264" y="18" width="124" height="44" rx="22"/>
  <use href="#openai-blossom" class="blossom" transform="translate(268.41 17.41) scale(0.06313)"/>
  <text class="name" x="313" y="47">Codex</text>
  <rect class="chip" x="398" y="18" width="168" height="44" rx="22"/>
  <use href="#robot" class="ink" transform="translate(422 41) scale(1.25)"/>
  <text class="name" x="440" y="47">any AI agent</text>
  <text class="lead" x="580" y="47">share one task list</text>

  <!-- The list -->
  <rect class="column" x="16" y="80" width="248" height="216" rx="14"/>
  <text class="head" x="32" y="116">Ready</text>
  <rect class="column" x="276" y="80" width="248" height="216" rx="14"/>
  <text class="head" x="292" y="116">In progress</text>
  <rect class="column" x="536" y="80" width="248" height="216" rx="14"/>
  <text class="head" x="552" y="116">Done</text>

  <rect class="lane" x="16" y="312" width="768" height="132" rx="14"/>
  <text class="head amber" x="32" y="346">Waiting for you</text>

  <text class="head" x="16" y="480">History</text>
  <line class="timeline" x1="26" y1="496" x2="774" y2="496"/>

  <g class="loop run">
    <rect id="you-on" class="you-on run" x="16" y="18" width="100" height="44" rx="22"/>
    <rect id="claude-on" class="chip-on run" x="126" y="18" width="128" height="44" rx="22"/>
    <rect id="codex-on" class="chip-on run" x="264" y="18" width="124" height="44" rx="22"/>

    <g id="lane-arrow" class="run red-line">
      <line x1="538" y1="395" x2="268" y2="395" stroke-width="2.5"/>
      <polygon points="268,388 268,402 256,395" stroke="none"/>
    </g>
    <text id="lane-empty" class="quiet c run" x="400" y="402">nothing is waiting for you now</text>

    <g id="docs" class="run">
      <rect class="card" x="546" y="132" width="228" height="70" rx="12"/>
      <text class="task" x="560" y="162">Write the docs</text>
      <g id="docs-agent" class="run">
        <use href="#claude" transform="translate(560 174) scale(0.6667)"/>
        <text class="tag" x="582" y="188">Claude</text>
      </g>
    </g>

    <g id="search" class="run">
      <rect class="card" x="286" y="214" width="228" height="70" rx="12"/>
      <text class="task" x="300" y="244">Fix the search</text>
      <g id="search-agent" class="run">
        <use href="#openai-blossom" class="blossom" transform="translate(291.57 247.57) scale(0.04591)"/>
        <text class="tag" x="322" y="270">Codex</text>
      </g>
    </g>

    <g id="choose" class="run">
      <rect class="card-decision" x="546" y="214" width="228" height="70" rx="12"/>
      <text class="task" x="560" y="244">Choose sign-in</text>
      <g id="choose-needs" class="run amber">
        <use href="#person" transform="translate(568 264)"/>
        <text class="tag amber" x="582" y="270">needs your decision</text>
      </g>
      <g id="choose-decided" class="run amber">
        <use href="#person" transform="translate(568 264)"/>
        <text class="tag amber" x="582" y="270">decided by you</text>
      </g>
    </g>

    <g id="build" class="run">
      <rect class="card" x="286" y="132" width="228" height="70" rx="12"/>
      <g id="build-blocked" class="run">
        <rect class="card-blocked" x="286" y="132" width="228" height="70" rx="12"/>
        <text class="tag red" x="300" y="188">blocked on your decision</text>
      </g>
      <text class="task" x="300" y="162">Build sign-in</text>
      <g id="build-agent" class="run">
        <use href="#claude" transform="translate(300 174) scale(0.6667)"/>
        <text class="tag" x="322" y="188">Claude</text>
      </g>
    </g>

    <!-- History -->
    <g id="event-1" class="run">
      <circle class="dot-agent" cx="31" cy="496" r="6"/>
      <text class="event" x="26" y="522">Claude took</text>
      <text class="event-task" x="26" y="542">Write the docs</text>
    </g>
    <g id="event-2" class="run">
      <circle class="dot-agent" cx="183" cy="496" r="6"/>
      <text class="event" x="178" y="522">Codex took</text>
      <text class="event-task" x="178" y="542">Fix the search</text>
    </g>
    <g id="event-3" class="run">
      <circle class="dot-agent" cx="335" cy="496" r="6"/>
      <text class="event" x="330" y="522">Claude finished</text>
      <text class="event-task" x="330" y="542">Write the docs</text>
    </g>
    <g id="event-4" class="run">
      <circle class="dot-you" cx="487" cy="496" r="6"/>
      <text class="event" x="482" y="522">You decided</text>
      <text class="event-task" x="482" y="542">Choose sign-in</text>
    </g>
    <g id="event-5" class="run">
      <circle class="dot-agent" cx="639" cy="496" r="6"/>
      <text class="event" x="634" y="522">Claude took</text>
      <text class="event-task" x="634" y="542">Build sign-in</text>
    </g>
  </g>
</svg>
