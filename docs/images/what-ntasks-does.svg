<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 388" width="800" height="388" role="img" aria-labelledby="title desc">
  <title id="title">What Ntasks does</title>
  <desc id="desc">You and two AI agents share one task list with four columns: Waiting, Ready, In progress and Done. Agent 1 takes the ready task "Write the plan" and finishes it. "Build the page", which waited on it, becomes ready, and Agent 2 takes it. "Publish the site" waits for you; once you approve it, it becomes ready. The history records each change and who made it.</desc>
  <defs>
    <g id="person" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <circle cx="0" cy="-4" r="3.6"/>
      <path d="M-6.5 7 A6.5 6.5 0 0 1 6.5 7"/>
    </g>
    <g id="robot" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <rect x="-7" y="-4" width="14" height="11" rx="3"/>
      <path d="M0 -4 V-8"/>
      <circle cx="0" cy="-9" r="1.2" fill="currentColor" stroke="none"/>
      <circle cx="-3" cy="1.5" r="1.3" fill="currentColor" stroke="none"/>
      <circle cx="3" cy="1.5" r="1.3" fill="currentColor" stroke="none"/>
    </g>
  </defs>
  <style>
    svg {
      --bg: #ffffff; --card: #f6f8fa; --line: #d0d7de; --edge: #818b98;
      --text: #1f2328; --muted: #59636e;
      --blue: #0969da; --blue-soft: #ddf4ff; --green: #1a7f37; --green-soft: #dafbe1;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --bg: #0d1117; --card: #161b22; --line: #3d444d; --edge: #768390;
        --text: #e6edf3; --muted: #9198a1;
        --blue: #4493f8; --blue-soft: #121d2f; --green: #3fb950; --green-soft: #12261e;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: var(--text); }
    .panel { fill: var(--bg); stroke: var(--line); }
    .lead { font-size: 18px; font-weight: 600; }
    .chip { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .chip-on { fill: var(--blue-soft); stroke: var(--blue); stroke-width: 2; opacity: 0; }
    .name { font-size: 16px; font-weight: 600; }
    .column { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .head { font-size: 17px; font-weight: 600; }
    .note { font-size: 14px; fill: var(--muted); }
    .card { fill: var(--bg); stroke: var(--line); stroke-width: 1.5; }
    .task { font-size: 16px; font-weight: 600; }
    .tag { font-size: 14px; font-weight: 600; }
    .blue { fill: var(--blue); color: var(--blue); }
    .green { fill: var(--green); color: var(--green); }
    .ink { color: var(--text); }
    .timeline { stroke: var(--line); stroke-width: 2; }
    .event-dot { fill: var(--blue); }
    .event { font-size: 15px; font-weight: 600; }

    /* Drawn as the list stands at the end. The animation starts each card
       where it began and moves it column by column. */
    .run { animation-duration: 18s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .loop { animation-name: loop; animation-timing-function: linear; }
    #plan { animation-name: plan; }
    #page { animation-name: page; }
    #site { animation-name: site; }
    #plan-agent { animation-name: plan-agent; }
    #page-after { animation-name: page-after; opacity: 0; }
    #page-agent { animation-name: page-agent; }
    #site-waiting { animation-name: site-waiting; opacity: 0; }
    #site-approved { animation-name: site-approved; }
    #agent1-on { animation-name: agent1-on; }
    #you-on { animation-name: you-on; }
    #agent2-on { animation-name: agent2-on; }
    #event-1 { animation-name: event-1; }
    #event-2 { animation-name: event-2; }
    #event-3 { animation-name: event-3; }
    #event-4 { animation-name: event-4; }

    @keyframes loop { 0% { opacity: 0; } 1.5%, 96% { opacity: 1; } 99.5%, 100% { opacity: 0; } }
    @keyframes plan { 0%, 13.9% { transform: translate(-388px, 0); } 17.2%, 30.6% { transform: translate(-194px, 0); } 33.9%, 100% { transform: translate(0, 0); } }
    @keyframes page { 0%, 36.1% { transform: translate(-388px, 0); } 39.4%, 69.4% { transform: translate(-194px, 0); } 72.8%, 100% { transform: translate(0, 0); } }
    @keyframes site { 0%, 52.8% { transform: translate(-194px, 66px); } 56.1%, 69.4% { transform: translate(0, 66px); } 72.8%, 100% { transform: translate(0, 0); } }
    @keyframes plan-agent { 0%, 13.9% { opacity: 0; } 15.5%, 100% { opacity: 1; } }
    @keyframes page-after { 0%, 34% { opacity: 1; } 35.5%, 100% { opacity: 0; } }
    @keyframes page-agent { 0%, 69.4% { opacity: 0; } 71%, 100% { opacity: 1; } }
    @keyframes site-waiting { 0%, 51% { opacity: 1; } 52.8%, 100% { opacity: 0; } }
    @keyframes site-approved { 0%, 52.8% { opacity: 0; } 54.5%, 100% { opacity: 1; } }
    @keyframes agent1-on { 0%, 12.5% { opacity: 0; } 13.9%, 17.2% { opacity: 1; } 19%, 29% { opacity: 0; } 30.6%, 33.9% { opacity: 1; } 35.5%, 100% { opacity: 0; } }
    @keyframes you-on { 0%, 48% { opacity: 0; } 50%, 56.1% { opacity: 1; } 58%, 100% { opacity: 0; } }
    @keyframes agent2-on { 0%, 68% { opacity: 0; } 69.4%, 72.8% { opacity: 1; } 74.5%, 100% { opacity: 0; } }
    @keyframes event-1 { 0%, 15% { opacity: 0; } 17.2%, 100% { opacity: 1; } }
    @keyframes event-2 { 0%, 32% { opacity: 0; } 33.9%, 100% { opacity: 1; } }
    @keyframes event-3 { 0%, 54% { opacity: 0; } 56.1%, 100% { opacity: 1; } }
    @keyframes event-4 { 0%, 71% { opacity: 0; } 72.8%, 100% { opacity: 1; } }

    @media (prefers-reduced-motion: reduce) {
      .run { animation: none; }
    }
  </style>

  <rect class="panel" x="0.5" y="0.5" width="799" height="387" rx="14"/>

  <!-- Who shares the list -->
  <text class="lead" x="16" y="45">You and your AI agents share one task list</text>
  <rect class="chip" x="476" y="22" width="76" height="36" rx="18"/>
  <rect class="chip" x="560" y="22" width="108" height="36" rx="18"/>
  <rect class="chip" x="676" y="22" width="108" height="36" rx="18"/>
  <g class="loop run">
    <rect id="you-on" class="chip-on run" x="476" y="22" width="76" height="36" rx="18"/>
    <rect id="agent1-on" class="chip-on run" x="560" y="22" width="108" height="36" rx="18"/>
    <rect id="agent2-on" class="chip-on run" x="676" y="22" width="108" height="36" rx="18"/>
  </g>
  <use href="#person" class="ink" x="496" y="40"/>
  <text class="name" x="512" y="46">You</text>
  <use href="#robot" class="ink" x="580" y="40"/>
  <text class="name" x="596" y="46">Agent 1</text>
  <use href="#robot" class="ink" x="696" y="40"/>
  <text class="name" x="712" y="46">Agent 2</text>

  <!-- The list -->
  <rect class="column" x="16" y="72" width="186" height="200" rx="12"/>
  <text class="head" x="30" y="98">Waiting</text>
  <text class="note" x="30" y="118">on a task or on you</text>
  <rect class="column" x="210" y="72" width="186" height="200" rx="12"/>
  <text class="head" x="224" y="98">Ready</text>
  <text class="note" x="224" y="118">any agent can take it</text>
  <rect class="column" x="404" y="72" width="186" height="200" rx="12"/>
  <text class="head" x="418" y="98">In progress</text>
  <text class="note" x="418" y="118">one agent at a time</text>
  <rect class="column" x="598" y="72" width="186" height="200" rx="12"/>
  <text class="head" x="612" y="98">Done</text>
  <text class="note" x="612" y="118">finished, with proof</text>

  <text class="head" x="16" y="302">History</text>
  <text class="note" x="90" y="302">every change, with who made it</text>
  <line class="timeline" x1="26" y1="322" x2="774" y2="322"/>

  <g class="loop run">
    <g id="plan" class="run">
      <rect class="card" x="608" y="132" width="166" height="58" rx="10"/>
      <text class="task" x="620" y="157">Write the plan</text>
      <g id="plan-agent" class="run blue">
        <use href="#robot" x="627" y="174"/>
        <text class="tag blue" x="640" y="179">Agent 1</text>
      </g>
    </g>

    <g id="page" class="run">
      <rect class="card" x="414" y="132" width="166" height="58" rx="10"/>
      <text class="task" x="426" y="157">Build the page</text>
      <text id="page-after" class="note run" x="426" y="179">after Write the plan</text>
      <g id="page-agent" class="run blue">
        <use href="#robot" x="433" y="174"/>
        <text class="tag blue" x="446" y="179">Agent 2</text>
      </g>
    </g>

    <g id="site" class="run">
      <rect class="card" x="220" y="132" width="166" height="58" rx="10"/>
      <text class="task" x="232" y="157">Publish the site</text>
      <g id="site-waiting" class="run blue">
        <use href="#person" x="239" y="174"/>
        <text class="tag blue" x="252" y="179">waiting for you</text>
      </g>
      <g id="site-approved" class="run green">
        <use href="#person" x="239" y="174"/>
        <text class="tag green" x="252" y="179">approved by you</text>
      </g>
    </g>

    <!-- History -->
    <g id="event-1" class="run">
      <circle class="event-dot" cx="31" cy="322" r="5"/>
      <text class="event" x="26" y="348">Agent 1 took</text>
      <text class="note" x="26" y="368">Write the plan</text>
    </g>
    <g id="event-2" class="run">
      <circle class="event-dot" cx="225" cy="322" r="5"/>
      <text class="event" x="220" y="348">Agent 1 finished</text>
      <text class="note" x="220" y="368">Write the plan</text>
    </g>
    <g id="event-3" class="run">
      <circle class="event-dot" cx="419" cy="322" r="5"/>
      <text class="event" x="414" y="348">You approved</text>
      <text class="note" x="414" y="368">Publish the site</text>
    </g>
    <g id="event-4" class="run">
      <circle class="event-dot" cx="613" cy="322" r="5"/>
      <text class="event" x="608" y="348">Agent 2 took</text>
      <text class="note" x="608" y="368">Build the page</text>
    </g>
  </g>
</svg>
