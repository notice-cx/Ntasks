<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Page not found · Ntasks</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try {
        const saved = localStorage.getItem('vitepress-theme-appearance');
        const dark = saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch {
        document.documentElement.classList.toggle('dark', matchMedia('(prefers-color-scheme: dark)').matches);
      }
    </script>
    <script type="module" src="./src/landing.ts"></script>
  </head>
  <body>
    <header class="site-header wrap">
      <a class="brand" href="/" aria-label="Ntasks home"><!--mark--><span>Ntasks</span></a>
      <nav class="header-nav" aria-label="Main">
        <a href="/docs/">Docs</a>
      </nav>
    </header>
    <main class="not-found wrap">
      <p class="hero-tagline">404</p>
      <h1>This page does not exist.</h1>
      <p class="hero-text">The address may have a typo, or the page may have moved.</p>
      <div class="actions">
        <a class="button primary" href="/">Go to the home page</a>
        <a class="text-link" href="/docs/">Read the docs</a>
      </div>
    </main>
  </body>
</html>
