name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request cancels the run it replaces. Every push to
# main gets its own group and runs to the end.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The required check: lint, typecheck, tests and the build, in the order a
  # contributor runs them. The build ends with `wrangler deploy --dry-run`,
  # which needs no Cloudflare account and deploys nothing.
  check:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      # Actions are pinned to a commit; Dependabot proposes each new release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Reads the pnpm version from package.json's packageManager.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      # The runner image includes ShellCheck.
      - run: shellcheck install.sh
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The npm package ntasks, from the build above, checked with
      # `npm pack --dry-run` and `wrangler deploy --dry-run`. It is a step of
      # its own because deployments built from a copy of the repository run
      # `pnpm run build` and need no package.
      - run: pnpm run package
      # The website: the landing page and docs/ rendered, with every link and
      # heading checked. It builds files only; nothing here deploys it.
      - run: pnpm site:build
