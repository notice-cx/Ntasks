packages:
  - "apps/*"
  - "workers/*"
  - "packages/*"
  - "tools/*"
  # The Shared Work Protocol's draft stands alone, so it can move to a home of its own.
  - "spec"
# Installing is an explicit step; running a script never reinstalls.
verifyDepsBeforeRun: error
# Packages whose install scripts may run: esbuild and workerd fetch their
# platform binaries. Every other package's install script is refused.
allowBuilds:
  esbuild: true
  sharp: false
  workerd: true
# eslint and typescript-eslint still depend on minimatch 10, whose releases
# before 11.0.1 have a denial-of-service flaw in glob matching. Drop this
# override once both ask for minimatch 11.0.1 or later.
overrides:
  minimatch: ^11.0.1
